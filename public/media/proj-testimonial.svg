<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 490" width="1280" height="490" role="img">
  <!-- ══════════════════════════════════════════════════════════
       VIDEO TESTIMONIAL SERVICE — system flow.
       Every step is a hover target: pointing at one opens a preview of
       that screen, drawn in the same document so there is nothing extra
       to fetch. The previews are likenesses — every name, transcript and
       thumbnail is ghost geometry, so they read as real screens without
       handing anyone something to build from.
       ══════════════════════════════════════════════════════════════ -->
